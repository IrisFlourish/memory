name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Encrypt site with password
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          staticrypt \
            --recursive \
            --password "$SITE_PASSWORD" \
            --short \
            --template-color-primary "#4a5568" \
            --template-color-secondary "#e2e8f0" \
            --template-title "Iris's Memory" \
            --template-instructions "请输入密码查看" \
            --template-button "进入" \
            --template-placeholder "密码" \
            --remember 30 \
            --template-remember "记住我 30 天" \
            -d .vitepress/dist \
            .vitepress/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4